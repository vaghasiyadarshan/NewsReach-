services:
  postgres:
    image: postgres:16
    container_name: newsreach-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsreach}
      POSTGRES_DB: ${POSTGRES_DB:-newsreach}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - newsreach-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsreach} -d ${POSTGRES_DB:-newsreach}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  newsreach-pgdata:
